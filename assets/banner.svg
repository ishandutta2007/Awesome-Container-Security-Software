<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { opacity: 0.25; transform: scale(0.95); }
      50% { opacity: 0.55; transform: scale(1.08); }
      100% { opacity: 0.25; transform: scale(0.95); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    .orb-1 {
      transform-origin: 200px 150px;
      animation: pulseOrb 7s ease-in-out infinite;
    }
    .orb-2 {
      transform-origin: 1000px 250px;
      animation: pulseOrb 9s ease-in-out infinite reverse;
    }
    .particle-slow {
      animation: floatParticle 8s ease-in-out infinite;
    }
    .circuit-line {
      stroke-dasharray: 20 10;
      animation: dashCycle 20s linear infinite;
    }
    .scanner {
      animation: scanLine 6s ease-in-out infinite;
    }
  </style>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />

  <!-- Cyber Grid Background -->
  <rect width="1200" height="400" fill="url(#cyberGrid)" />

  <!-- Dynamic Animated Glowing Orbs (Background Layer) -->
  <circle class="orb-1" cx="200" cy="150" r="160" fill="#0284c7" opacity="0.35" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="240" r="180" fill="#6366f1" opacity="0.3" filter="url(#glow)" />
  <circle class="orb-1" cx="600" cy="350" r="130" fill="#a855f7" opacity="0.2" filter="url(#glow)" />

  <!-- Dynamic Network / Container Circuit Lines (Background) -->
  <g class="circuit-line" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 50 100 L 220 100 L 290 170 L 450 170" />
    <path d="M 750 230 L 910 230 L 980 160 L 1150 160" />
    <path d="M 100 320 L 300 320 L 380 240 L 520 240" />
    <path d="M 680 160 L 820 160 L 890 90 L 1100 90" />
  </g>

  <!-- Scanning beam effect -->
  <line class="scanner" x1="0" y1="10" x2="1200" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" filter="url(#subtleGlow)" />

  <!-- Floating Dynamic Tech Particles -->
  <circle class="particle-slow" cx="180" cy="280" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)" />
  <circle class="particle-slow" cx="340" cy="90" r="2.5" fill="#818cf8" />
  <circle class="particle-slow" cx="860" cy="320" r="4" fill="#c084fc" filter="url(#subtleGlow)" />
  <circle class="particle-slow" cx="1050" cy="110" r="3" fill="#38bdf8" />
  <circle class="particle-slow" cx="500" cy="70" r="2" fill="#6ee7b7" />

  <!-- Decorative Hexagon Security Nodes (Watermark style) -->
  <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" fill="url(#shieldGrad)" transform="translate(960, 50)">
    <polygon points="50,0 100,28 100,85 50,113 0,85 0,28" />
    <path d="M 50 20 L 80 35 L 80 65 Q 80 85 50 95 Q 20 85 20 65 L 20 35 Z" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
  </g>
  <g stroke="#818cf8" stroke-opacity="0.15" stroke-width="1.5" fill="url(#shieldGrad)" transform="translate(100, 180) scale(0.7)">
    <polygon points="50,0 100,28 100,85 50,113 0,85 0,28" />
  </g>

  <!-- FOREGROUND: Content Card & Typography (High Contrast, Never Obscured) -->
  <g transform="translate(100, 75)">
    <!-- Super Category Pill -->
    <rect x="0" y="0" width="340" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" filter="url(#subtleGlow)" />
    <circle cx="16" cy="17" r="5" fill="#10b981" />
    <text x="32" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">CURATED CONTAINER SECURITY</text>

    <!-- Main Title -->
    <text x="0" y="92" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome <tspan fill="url(#accentGrad)">Container Security</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
      Enterprise CNAPP, Image Vulnerability Scanning, eBPF Runtime Threat Defense &amp; Kubernetes Admission
    </text>

    <!-- Feature Attribute Badges -->
    <g transform="translate(0, 168)">
      <!-- Badge 1: CVE Scanning -->
      <g transform="translate(0, 0)">
        <rect width="170" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Image &amp; SBOM Scan</text>
      </g>
      <!-- Badge 2: eBPF Runtime -->
      <g transform="translate(182, 0)">
        <rect width="175" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ eBPF Threat Runtime</text>
      </g>
      <!-- Badge 3: Admission Control -->
      <g transform="translate(369, 0)">
        <rect width="180" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 Kubernetes Admission</text>
      </g>
      <!-- Badge 4: Supply Chain -->
      <g transform="translate(561, 0)">
        <rect width="185" height="32" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📦 Supply Chain Defense</text>
      </g>
    </g>
  </g>
</svg>